name: Go

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  create:
    tags:
      - 'v*'

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  tagged-release-binaries:
    # Only on tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - golangci
    name: Tagged release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract tag
        shell: bash
        run: echo "tag=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/tags/}}" >> $GITHUB_OUTPUT
        id: extract_tag

      - name: Build binaries
        env:
          VERSION: "${{ steps.extract_tag.outputs.tag }}"
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ./bin
          go build -buildvcs=true -o ./bin "-ldflags=-X main.Version=${VERSION}" ./

      - name: Generate Changelog
        run: "./scripts/read_changelog.sh ${{ steps.extract_tag.outputs.tag }} >> ${{ github.workspace }}-CHANGELOG.txt"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "bin/*"
          body_path: "${{ github.workspace }}-CHANGELOG.txt"
          make_latest: true
          fail_on_unmatched_files: true
